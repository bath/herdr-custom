<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>File drop to a remote terminal: stock vs sheperd</title>
  <defs>
    <g id="file">
      <path d="M2 1h16l8 8v26a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2z" fill="#ffffff" stroke="#8a8984" stroke-width="1.4"/>
      <path d="M18 1v8h8" fill="none" stroke="#8a8984" stroke-width="1.4"/>
      <path d="M9 17l9 6-9 6z" fill="#3b6fd8"/>
    </g>
    <g id="laptop">
      <rect x="3" y="0" width="34" height="22" rx="2.5" fill="none" stroke="#4a4945" stroke-width="1.6"/>
      <path d="M0 26h40" stroke="#4a4945" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="server">
      <rect x="0" y="0" width="36" height="12" rx="2.5" fill="none" stroke="#4a4945" stroke-width="1.6"/>
      <rect x="0" y="15" width="36" height="12" rx="2.5" fill="none" stroke="#4a4945" stroke-width="1.6"/>
      <circle cx="29" cy="6" r="1.6" fill="#2f7d4f"/><circle cx="29" cy="21" r="1.6" fill="#2f7d4f"/>
    </g>
    <g id="folder">
      <path d="M0 4a3 3 0 0 1 3-3h7l3 3h12a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z" fill="#e8eefb" stroke="#3b6fd8" stroke-width="1.4"/>
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8a8984"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2f7d4f"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1099" height="499" rx="16" fill="#faf9f7" stroke="#e3e1dc"/>

  <!-- shared headings -->
  <g font-size="12" font-weight="600" fill="#8a8984" letter-spacing="0.6">
    <text x="64" y="40">YOUR MAC</text>
    <text x="808" y="40">REMOTE MACHINE</text>
  </g>

  <!-- ================= STOCK ================= -->
  <text x="40" y="78" font-size="15" font-weight="700" fill="#1f1f1d">Stock Herdr</text>

  <g transform="translate(40 94)">
    <rect x="0.5" y="0.5" width="250" height="110" rx="10" fill="#ffffff" stroke="#e3e1dc"/>
    <use href="#laptop" x="20" y="18"/>
    <use href="#file" x="24" y="56"/>
    <text x="64" y="70" font-size="13" font-weight="600" fill="#1f1f1d">demo-recording.mov</text>
    <text x="64" y="89" font-size="12.5" fill="#6b6a65">30 MB · drag onto a terminal</text>
  </g>

  <path d="M300 149 H 520" stroke="#8a8984" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <g transform="translate(530 132)">
    <circle cx="16" cy="17" r="15" fill="#fbe9e1" stroke="#c2410c" stroke-width="1.4"/>
    <path d="M11 12l10 10M21 12l-10 10" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="572" y="146" font-size="13" font-weight="600" fill="#c2410c">Fails: files over 8 MB</text>
  <text x="572" y="164" font-size="12.5" fill="#6b6a65">don’t make it across</text>

  <g transform="translate(808 94)">
    <rect x="0.5" y="0.5" width="251" height="110" rx="10" fill="#ffffff" stroke="#e3e1dc" stroke-dasharray="4 4"/>
    <use href="#server" x="20" y="18"/>
    <text x="68" y="30" font-size="12.5" fill="#6b6a65">Small files only go to a</text>
    <text x="68" y="47" font-size="12.5" fill="#6b6a65">folder for that terminal.</text>
    <text x="20" y="80" font-size="12.5" fill="#c2410c" font-weight="600">Close the terminal and</text>
    <text x="20" y="97" font-size="12.5" fill="#c2410c" font-weight="600">the files are gone.</text>
  </g>

  <line x1="40" y1="238" x2="1060" y2="238" stroke="#e3e1dc"/>

  <!-- ================= CUSTOM ================= -->
  <text x="40" y="276" font-size="15" font-weight="700" fill="#1f1f1d">With sheperd</text>

  <g transform="translate(40 292)">
    <rect x="0.5" y="0.5" width="250" height="110" rx="10" fill="#ffffff" stroke="#e3e1dc"/>
    <use href="#laptop" x="20" y="18"/>
    <use href="#file" x="24" y="56"/>
    <text x="64" y="70" font-size="13" font-weight="600" fill="#1f1f1d">demo-recording.mov</text>
    <text x="64" y="89" font-size="12.5" fill="#6b6a65">30 MB · drag onto a terminal</text>
  </g>

  <!-- pieces travelling -->
  <path d="M300 347 H 790" stroke="#2f7d4f" stroke-width="1.6" marker-end="url(#arrow-ok)"/>
  <g font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">
    <g>
      <rect x="352" y="330" width="78" height="34" rx="7" fill="#3b6fd8"/>
      <text x="391" y="352">8 MB</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="442" y="330" width="78" height="34" rx="7" fill="#3b6fd8"/>
      <text x="481" y="352">8 MB</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="532" y="330" width="78" height="34" rx="7" fill="#3b6fd8"/>
      <text x="571" y="352">8 MB</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="622" y="330" width="62" height="34" rx="7" fill="#6f95e3"/>
      <text x="653" y="352">6 MB</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <text x="352" y="392" font-size="12.5" fill="#6b6a65">hc sends any size in 8 MB pieces. The remote end joins them into one file.</text>

  <g transform="translate(808 292)">
    <rect x="0.5" y="0.5" width="251" height="146" rx="10" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.4"/>
    <use href="#folder" x="20" y="16"/>
    <text x="58" y="33" font-size="13" font-weight="600" fill="#1f1f1d" font-family="'SF Mono', Menlo, Consolas, monospace">~/file-drop/</text>
    <g font-size="12" fill="#4a4945" font-family="'SF Mono', Menlo, Consolas, monospace">
      <text x="34" y="62">demo-recording.mov</text>
      <text x="34" y="80">sales-q3.csv</text>
      <text x="34" y="98">screenshot.png</text>
    </g>
    <text x="20" y="120" font-size="12.5" fill="#2f7d4f" font-weight="600">One folder. Files stay after</text>
    <text x="20" y="137" font-size="12.5" fill="#2f7d4f" font-weight="600">the terminal closes.</text>
  </g>
</svg>
