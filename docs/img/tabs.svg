<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Herdr tabs: stock vs sheperd</title>
  <defs>
    <g id="claude">
      <!-- small sparkle: the Claude Code program icon -->
      <path d="M7 0.8v12.4M0.8 7h12.4M2.6 2.6l8.8 8.8M11.4 2.6l-8.8 8.8" stroke="#c96442" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="shell">
      <rect x="0.75" y="1.75" width="12.5" height="10.5" rx="2" fill="none" stroke="#6b6a65" stroke-width="1.3"/>
      <path d="M3.5 5l2 2-2 2M7 9.5h3.5" fill="none" stroke="#6b6a65" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="spin">
      <circle cx="6" cy="6" r="4.6" fill="none" stroke="#f0d9c2" stroke-width="1.8"/>
      <path d="M6 1.4a4.6 4.6 0 0 1 4.6 4.6" fill="none" stroke="#d9822b" stroke-width="1.8" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 6 6" to="360 6 6" dur="0.9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g id="lights">
      <circle cx="0" cy="0" r="6" fill="#ff5f57"/>
      <circle cx="20" cy="0" r="6" fill="#febc2e"/>
      <circle cx="40" cy="0" r="6" fill="#28c840"/>
    </g>
    <g id="term">
      <!-- faint terminal text for the pane under the tab strip -->
      <rect x="0" y="0" width="300" height="7" rx="3.5" fill="#ecebe7"/>
      <rect x="0" y="18" width="460" height="7" rx="3.5" fill="#ecebe7"/>
      <rect x="0" y="36" width="380" height="7" rx="3.5" fill="#ecebe7"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="1099" height="519" rx="16" fill="#faf9f7" stroke="#e3e1dc"/>

  <!-- ================= STOCK ================= -->
  <text x="40" y="44" font-size="15" font-weight="700" fill="#1f1f1d">Stock Herdr</text>
  <text x="40" y="66" font-size="13.5" fill="#6b6a65">Four agents, four tabs that all say “Claude”. You click each one to find the work you want.</text>

  <g transform="translate(40 84)">
    <rect x="0.5" y="0.5" width="1019" height="150" rx="10" fill="#ffffff" stroke="#e3e1dc"/>
    <path d="M10.5 0.5h999a10 10 0 0 1 10 10v31.5h-1019v-31.5a10 10 0 0 1 10-10z" fill="#f3f2ef"/>
    <line x1="0.5" y1="42" x2="1019.5" y2="42" stroke="#e3e1dc"/>
    <use href="#lights" x="20" y="21"/>

    <!-- tabs: one line, program name only -->
    <g transform="translate(96 7)">
      <rect x="0" y="0" width="118" height="28" rx="7" fill="#ffffff" stroke="#e3e1dc"/>
      <use href="#claude" x="11" y="7"/>
      <text x="32" y="18.5" font-size="13" font-weight="600" fill="#1f1f1d">Claude</text>
      <use href="#spin" x="94" y="8"/>
    </g>
    <g transform="translate(220 7)">
      <use href="#claude" x="11" y="7"/>
      <text x="32" y="18.5" font-size="13" fill="#4a4945">Claude</text>
      <circle cx="99" cy="14" r="3.5" fill="#2f7d4f"/>
    </g>
    <g transform="translate(344 7)">
      <use href="#claude" x="11" y="7"/>
      <text x="32" y="18.5" font-size="13" fill="#4a4945">Claude</text>
      <circle cx="99" cy="14" r="3.5" fill="#c2410c"/>
    </g>
    <g transform="translate(468 7)">
      <use href="#claude" x="11" y="7"/>
      <text x="32" y="18.5" font-size="13" fill="#4a4945">Claude</text>
      <use href="#spin" x="94" y="8"/>
    </g>
    <g transform="translate(592 7)">
      <use href="#shell" x="11" y="7"/>
      <text x="32" y="18.5" font-size="13" fill="#4a4945">zsh</text>
    </g>

    <use href="#term" x="28" y="72"/>
    <!-- question marks over the identical tabs -->
    <g font-size="12.5" font-weight="600" fill="#c2410c">
      <text x="300" y="132">Which tab is the login bug? What is each one doing?</text>
    </g>
    <path d="M296 125 C 230 120, 170 100, 160 52" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M155 58 l5 -7 l4 8" fill="none" stroke="#c2410c" stroke-width="1.2"/>
  </g>

  <!-- ================= CUSTOM ================= -->
  <text x="40" y="282" font-size="15" font-weight="700" fill="#1f1f1d">With sheperd</text>
  <text x="40" y="304" font-size="13.5" fill="#6b6a65">Line 1: what the tab started as.  Line 2: what it is doing now.  You see all the work at a glance.</text>

  <g transform="translate(40 322)">
    <rect x="0.5" y="0.5" width="1019" height="172" rx="10" fill="#ffffff" stroke="#e3e1dc"/>
    <path d="M10.5 0.5h999a10 10 0 0 1 10 10v47.5h-1019v-47.5a10 10 0 0 1 10-10z" fill="#f3f2ef"/>
    <line x1="0.5" y1="58" x2="1019.5" y2="58" stroke="#e3e1dc"/>
    <use href="#lights" x="20" y="29"/>

    <!-- tab 1: active, working -->
    <g transform="translate(96 6)">
      <rect x="0" y="0" width="226" height="46" rx="8" fill="#ffffff" stroke="#e3e1dc"/>
      <use href="#claude" x="11" y="9"/>
      <text x="33" y="20" font-size="13" font-weight="600" fill="#1f1f1d">Fix the login redirect loop</text>
      <use href="#spin" x="205" y="9"/>
      <text x="33" y="37" font-size="11.5" fill="#6b6a65">↳ Running the auth tests again</text>
    </g>
    <!-- tab 2: done -->
    <g transform="translate(328 6)">
      <use href="#claude" x="11" y="9"/>
      <text x="33" y="20" font-size="13" font-weight="500" fill="#4a4945">Add CSV export to reports</text>
      <circle cx="210" cy="15" r="3.5" fill="#2f7d4f"/>
      <text x="33" y="37" font-size="11.5" fill="#6b6a65">↳ Opened PR #42 with the export</text>
    </g>
    <!-- tab 3: blocked -->
    <g transform="translate(560 6)">
      <use href="#claude" x="11" y="9"/>
      <text x="33" y="20" font-size="13" font-weight="500" fill="#4a4945">Upgrade Postgres client</text>
      <circle cx="210" cy="15" r="3.5" fill="#c2410c"/>
      <text x="33" y="37" font-size="11.5" fill="#c2410c" font-weight="600">↳ Needs you</text>
    </g>
    <!-- tab 4: working -->
    <g transform="translate(792 6)">
      <use href="#claude" x="11" y="9"/>
      <text x="33" y="20" font-size="13" font-weight="500" fill="#4a4945">Write the onboarding docs</text>
      <use href="#spin" x="205" y="9"/>
      <text x="33" y="37" font-size="11.5" fill="#6b6a65">↳ Adding the install section</text>
    </g>

    <use href="#term" x="28" y="86"/>
    <g font-size="12.5" font-weight="600" fill="#2f7d4f">
      <text x="560" y="150">The task stays on line 1, even when the agent’s title changes.</text>
    </g>
  </g>
</svg>
